<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>玉転がし迷路ゲーム</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #fafafa;
    }
    #game {
      position: relative;
      width: 90vw;
      height: 90vw;
      max-width: 400px;
      max-height: 400px;
      margin: 20px auto;
      background-color: #eee;
      border: 5px solid #444;
    }
    .ball {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: red;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .goal {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: green;
      border: 2px solid darkgreen;
      border-radius: 4px;
    }
    .hole {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: black;
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.8);
    }
    .wall {
      position: absolute;
      background-color: #333;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    #startButton {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #startButton:hover {
      background-color: #45a049;
    }
    #info {
      margin: 10px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

<h1>玉転がし迷路ゲーム</h1>
<div id="info">デバイスを傾けてボールを操作し、緑のゴールを目指しましょう！<br>黒い穴に落ちないよう注意してください。</div>
<button id="startButton">スタート</button>
<div id="game">
  <div class="ball" id="ball"></div>
  <div class="goal" id="goal"></div>
</div>

<audio id="startSound" src="start.mp3"></audio>
<audio id="goalSound" src="goal.mp3"></audio>
<audio id="fallSound" src="fall.mp3"></audio>

<script>
  const game = document.getElementById("game");
  const ball = document.getElementById("ball");
  const goal = document.getElementById("goal");
  const startButton = document.getElementById("startButton");
  const startSound = document.getElementById("startSound");
  const goalSound = document.getElementById("goalSound");
  const fallSound = document.getElementById("fallSound");

  let posX = 0;
  let posY = 0;
  let velocityX = 0;
  let velocityY = 0;
  let walls = [];
  let holes = [];
  let gameRunning = false;

  // 音声を動的に作成（実際のファイルがない場合の代替）
  function createAudioElement(frequency, duration, type = 'sine') {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    oscillator.type = type;
    
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration);
  }

  function playStartSound() {
    try {
      if (startSound && startSound.play) {
        startSound.play().catch(e => {
          console.log('Audio file not found, using fallback');
          playFallbackStartSound();
        });
      } else {
        playFallbackStartSound();
      }
    } catch (e) {
      playFallbackStartSound();
    }
  }

  function playFallbackStartSound() {
    try {
      createAudioElement(523, 0.2);
      setTimeout(() => createAudioElement(659, 0.2), 100);
      setTimeout(() => createAudioElement(784, 0.3), 200);
    } catch (e) {
      console.log('Audio not supported');
    }
  }

  function playGoalSound() {
    try {
      if (goalSound && goalSound.play) {
        goalSound.play().catch(e => {
          console.log('Audio file not found, using fallback');
          playFallbackGoalSound();
        });
      } else {
        playFallbackGoalSound();
      }
    } catch (e) {
      playFallbackGoalSound();
    }
  }

  function playFallbackGoalSound() {
    try {
      createAudioElement(523, 0.15);
      setTimeout(() => createAudioElement(659, 0.15), 100);
      setTimeout(() => createAudioElement(784, 0.15), 200);
      setTimeout(() => createAudioElement(1047, 0.4), 300);
    } catch (e) {
      console.log('Audio not supported');
    }
  }

  function playFallSound() {
    try {
      if (fallSound && fallSound.play) {
        fallSound.play().catch(e => {
          console.log('Audio file not found, using fallback');
          playFallbackFallSound();
        });
      } else {
        playFallbackFallSound();
      }
    } catch (e) {
      playFallbackFallSound();
    }
  }

  function playFallbackFallSound() {
    try {
      for (let i = 0; i < 10; i++) {
        setTimeout(() => createAudioElement(800 - i * 60, 0.05, 'sawtooth'), i * 20);
      }
    } catch (e) {
      console.log('Audio not supported');
    }
  }

  function createMazeWalls() {
    // 既存の壁を削除
    walls.forEach(w => w.remove());
    walls = [];

    const mazeData = [
      {x: 50, y: 0, w: 10, h: 300},
      {x: 100, y: 100, w: 200, h: 10},
      {x: 200, y: 200, w: 10, h: 100},
      {x: 0, y: 150, w: 100, h: 10},
      {x: 150, y: 50, w: 10, h: 100},
      {x: 250, y: 0, w: 10, h: 150}
    ];

    mazeData.forEach(w => {
      const wall = document.createElement("div");
      wall.className = "wall";
      wall.style.left = `${w.x}px`;
      wall.style.top = `${w.y}px`;
      wall.style.width = `${w.w}px`;
      wall.style.height = `${w.h}px`;
      game.appendChild(wall);
      walls.push({element: wall, x: w.x, y: w.y, w: w.w, h: w.h});
    });
  }

  function createHoles() {
    // 既存の穴を削除
    holes.forEach(h => h.element.remove());
    holes = [];

    const numHoles = 3;
    const maxAttempts = 50;

    for (let i = 0; i < numHoles; i++) {
      let attempts = 0;
      let validPosition = false;
      let holeX, holeY;

      while (!validPosition && attempts < maxAttempts) {
        holeX = Math.random() * (game.clientWidth - 30);
        holeY = Math.random() * (game.clientHeight - 30);
        
        validPosition = true;
        
        // 壁との重複チェック
        for (const wall of walls) {
          if (!(holeX + 30 < wall.x || holeX > wall.x + wall.w || 
                holeY + 30 < wall.y || holeY > wall.y + wall.h)) {
            validPosition = false;
            break;
          }
        }

        // 他の穴との重複チェック
        for (const hole of holes) {
          const distance = Math.sqrt((holeX - hole.x) ** 2 + (holeY - hole.y) ** 2);
          if (distance < 60) {
            validPosition = false;
            break;
          }
        }

        attempts++;
      }

      if (validPosition) {
        const holeElement = document.createElement("div");
        holeElement.className = "hole";
        holeElement.style.left = `${holeX}px`;
        holeElement.style.top = `${holeY}px`;
        game.appendChild(holeElement);
        holes.push({element: holeElement, x: holeX, y: holeY});
      }
    }
  }

  function findValidPosition(width, height, excludeWalls = true, excludeHoles = true) {
    const maxAttempts = 100;
    let attempts = 0;

    while (attempts < maxAttempts) {
      const x = Math.random() * (game.clientWidth - width);
      const y = Math.random() * (game.clientHeight - height);
      let valid = true;

      // 壁との重複チェック
      if (excludeWalls) {
        for (const wall of walls) {
          if (!(x + width < wall.x || x > wall.x + wall.w || 
                y + height < wall.y || y > wall.y + wall.h)) {
            valid = false;
            break;
          }
        }
      }

      // 穴との重複チェック
      if (valid && excludeHoles) {
        for (const hole of holes) {
          if (!(x + width < hole.x || x > hole.x + 30 || 
                y + height < hole.y || y > hole.y + 30)) {
            valid = false;
            break;
          }
        }
      }

      if (valid) {
        return {x, y};
      }
      attempts++;
    }

    // フォールバック位置
    return {x: 10, y: 10};
  }

  function resetBallAndGoal() {
    // ボールの位置をリセット
    const ballPos = findValidPosition(20, 20);
    posX = ballPos.x;
    posY = ballPos.y;
    velocityX = 0;
    velocityY = 0;
    ball.style.left = `${posX}px`;
    ball.style.top = `${posY}px`;

    // ゴールの位置をリセット
    const goalPos = findValidPosition(30, 30);
    goal.style.left = `${goalPos.x}px`;
    goal.style.top = `${goalPos.y}px`;
  }

  function detectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
    return !(x1 + w1 < x2 || x1 > x2 + w2 || y1 + h1 < y2 || y1 > y2 + h2);
  }

  function checkWallCollision(newX, newY) {
    for (const wall of walls) {
      if (detectCollision(newX, newY, 20, 20, wall.x, wall.y, wall.w, wall.h)) {
        return true;
      }
    }
    return false;
  }

  function updateBall() {
    if (!gameRunning) return;

    const friction = 0.98;
    velocityX *= friction;
    velocityY *= friction;

    // 新しい位置を計算
    let newX = posX + velocityX;
    let newY = posY + velocityY;

    // 壁との衝突をチェックして修正
    if (checkWallCollision(newX, posY)) {
      velocityX *= -0.3;
      newX = posX;
    }
    
    if (checkWallCollision(posX, newY)) {
      velocityY *= -0.3;
      newY = posY;
    }

    if (checkWallCollision(newX, newY)) {
      velocityX *= -0.3;
      velocityY *= -0.3;
      newX = posX;
      newY = posY;
    }

    // ゲーム領域内に制限
    newX = Math.max(0, Math.min(game.clientWidth - 20, newX));
    newY = Math.max(0, Math.min(game.clientHeight - 20, newY));

    posX = newX;
    posY = newY;

    ball.style.left = `${posX}px`;
    ball.style.top = `${posY}px`;

    // ゴール判定
    const goalRect = goal.getBoundingClientRect();
    const gameRect = game.getBoundingClientRect();
    const goalX = goalRect.left - gameRect.left;
    const goalY = goalRect.top - gameRect.top;
    
    if (detectCollision(posX, posY, 20, 20, goalX, goalY, 30, 30)) {
      gameRunning = false;
      playGoalSound();
      setTimeout(() => {
        alert("ゴール成功！");
        resetGame();
      }, 500);
      return;
    }

    // 穴との衝突判定
    for (const hole of holes) {
      if (detectCollision(posX, posY, 20, 20, hole.x, hole.y, 30, 30)) {
        gameRunning = false;
        playFallSound();
        setTimeout(() => {
          alert("穴に落ちました！ゲームオーバー");
          resetGame();
        }, 500);
        return;
      }
    }

    requestAnimationFrame(updateBall);
  }

  function handleDeviceOrientation(e) {
    if (!gameRunning) return;
    
    const maxTilt = 30;
    const maxVelocity = 3;
    
    const gammaRatio = Math.max(-1, Math.min(1, (e.gamma || 0) / maxTilt));
    const betaRatio = Math.max(-1, Math.min(1, (e.beta || 0) / maxTilt));
    
    velocityX += gammaRatio * 0.3;
    velocityY += betaRatio * 0.3;
    
    velocityX = Math.max(-maxVelocity, Math.min(maxVelocity, velocityX));
    velocityY = Math.max(-maxVelocity, Math.min(maxVelocity, velocityY));
  }

  function resetGame() {
    gameRunning = false;
    createMazeWalls();
    createHoles();
    resetBallAndGoal();
    startButton.style.display = 'inline-block';
  }

  function startGame() {
    playStartSound();
    startButton.style.display = 'none';
    
    // デバイスの向きの許可を要求
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response == 'granted') {
            window.addEventListener("deviceorientation", handleDeviceOrientation);
          }
          startGameLoop();
        })
        .catch(err => {
          console.log('DeviceOrientation permission denied:', err);
          startGameLoop();
        });
    } else {
      window.addEventListener("deviceorientation", handleDeviceOrientation);
      startGameLoop();
    }
  }

  function startGameLoop() {
    gameRunning = true;
    updateBall();
  }

  startButton.addEventListener("click", () => {
    resetGame();
    startGame();
  });

  // 初期化
  resetGame();
</script>

</body>
</html>
