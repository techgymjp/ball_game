<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>玉転がし迷路ゲーム</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #fafafa;
    }
    #game {
      position: relative;
      width: 90vw;
      height: 90vw;
      max-width: 400px;
      max-height: 400px;
      margin: 20px auto;
      background-color: #eee;
      border: 5px solid #444;
    }
    .ball {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: red;
    }
    .goal {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: green;
    }
    .hole {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: black;
    }
    .wall {
      position: absolute;
      background-color: #333;
    }
    #startButton {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>玉転がし迷路ゲーム</h1>
<button id="startButton">スタート</button>
<div id="game">
  <div class="ball" id="ball"></div>
  <div class="goal" id="goal"></div>
</div>

<audio id="goalSound" src="goal.mp3"></audio>
<audio id="fallSound" src="fall.mp3"></audio>

<script>
  const game = document.getElementById("game");
  const ball = document.getElementById("ball");
  const goal = document.getElementById("goal");
  const winSound = document.getElementById("winSound");
  const failSound = document.getElementById("failSound");
  const startButton = document.getElementById("startButton");

  let posX = 0;
  let posY = 0;
  let velocityX = 0;
  let velocityY = 0;
  let walls = [];

  function createMazeWalls() {
    // 既存の壁を削除
    walls.forEach(w => w.remove());
    walls = [];

    const maze = [
      {x: 50, y: 0, w: 10, h: 300},
      {x: 100, y: 100, w: 200, h: 10},
      {x: 200, y: 200, w: 10, h: 100},
      {x: 0, y: 150, w: 100, h: 10},
    ];

    maze.forEach(w => {
      const wall = document.createElement("div");
      wall.className = "wall";
      wall.style.left = `${w.x}px`;
      wall.style.top = `${w.y}px`;
      wall.style.width = `${w.w}px`;
      wall.style.height = `${w.h}px`;
      game.appendChild(wall);
      walls.push(wall);
    });
  }

  function resetBallAndGoal() {
    const gameRect = game.getBoundingClientRect();

    posX = Math.random() * (game.clientWidth - 20);
    posY = Math.random() * (game.clientHeight - 20);
    ball.style.left = `${posX}px`;
    ball.style.top = `${posY}px`;

    const goalX = Math.random() * (game.clientWidth - 30);
    const goalY = Math.random() * (game.clientHeight - 30);
    goal.style.left = `${goalX}px`;
    goal.style.top = `${goalY}px`;
  }

  function detectCollision(rect1, rect2) {
    return !(
      rect1.right < rect2.left ||
      rect1.left > rect2.right ||
      rect1.bottom < rect2.top ||
      rect1.top > rect2.bottom
    );
  }

  function updateBall() {
    posX += velocityX;
    posY += velocityY;

    posX = Math.max(0, Math.min(game.clientWidth - 20, posX));
    posY = Math.max(0, Math.min(game.clientHeight - 20, posY));

    ball.style.left = `${posX}px`;
    ball.style.top = `${posY}px`;

    const ballRect = ball.getBoundingClientRect();
    const goalRect = goal.getBoundingClientRect();

    // 壁との衝突
    for (const wall of walls) {
      if (detectCollision(ballRect, wall.getBoundingClientRect())) {
        // 反発させる
        velocityX *= -0.5;
        velocityY *= -0.5;
      }
    }

    // ゴール判定
    if (detectCollision(ballRect, goalRect)) {
      winSound.play();
      alert("ゴール成功！");
      resetBallAndGoal();
    }

    requestAnimationFrame(updateBall);
  }

  function startGame() {
    createMazeWalls();
    window.addEventListener("deviceorientation", (e) => {
      velocityX = e.gamma * 0.2;
      velocityY = e.beta * 0.2;
    });
    updateBall();
  }

  startButton.addEventListener("click", () => {
    resetBallAndGoal();
    startGame();
  });
</script>

</body>
</html>
